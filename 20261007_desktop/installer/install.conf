# qwen-coding-stack installer settings: Qwen3.6-35B-A3B on the Pop!_OS desktop (RTX 5080).
# Edit, then run ./install.sh. Empty values ("") use the defaults shown.
#
# These values seed config/server.env the FIRST time it's created. After that,
# change server settings with:  qwen-set KEY=VALUE   (re-running the installer
# never overwrites your tuned server.env).

# Project directory (everything is installed under it).
QCS=/home/tristanv/Development/qwen-coding-stack

# This folder is for the Pop!_OS desktop; the installer refuses to run on another OS.
PROFILE=popos-desktop

# CUDA toolkit version: auto (recommended) or a 13.x version like 13.1.
#   auto = the newest version your NVIDIA driver supports. A version is always
#   lowered to what the driver supports, and 13.2 (gibberish bug) is never used.
#   Plain "13" is treated as auto.
CUDA_VER=auto

# Reboot automatically when phase 1 needs it (driver / docker group).
#   no  = ask first      yes = reboot after a 15-second countdown
AUTO_REBOOT=no

# Reuse the model from the earlier manual setup (~/models), stop the old per-user
# service, and remove the old PATH/CUDA lines from ~/.bashrc.
MIGRATE_OLD=yes

# Find the GPU/RAM split automatically (find-ncmoe) on first install.
RUN_TUNING=yes
# Re-run tuning even if it already succeeded once.
RETUNE=no
# Values find-ncmoe tries, in order. Default: "26 28 30 32 34 36 38 40"
NCMOE_RANGE=""

# Starting values for server.env (first creation only). Defaults: NCMOE=24 CTX=131072 THREADS=""
NCMOE=""
CTX=""
THREADS=""

# Measure the fastest CPU thread count with llama-bench: auto (= no here) | yes | no
TUNE_THREADS=auto

# Sandbox container limits. Defaults: 6g / 4
SANDBOX_MEMORY=""
SANDBOX_CPUS=""

# More Debian (bookworm) packages to bake into the sandbox image, separated by spaces,
# e.g. "libsdl2-2.0-0 ffmpeg". The agent can't apt-get install inside the sandbox
# (it has no root), so add system libraries here and re-run install.sh: the image
# rebuilds when this changes.
SANDBOX_EXTRA_PACKAGES=""

# Read-only GitHub access for the sandbox: repositories as OWNER/REPO, separated by spaces,
# e.g. "haxxards/godot". For each one the installer makes a deploy key and shows the public
# key to add on GitHub (repository Settings > Deploy keys, "Allow write access" unticked).
# A key that can push, or a personal account key, is refused. Keys are kept outside this
# repository, in qwen-coding-stack/config/github/OWNER/REPO/deploy_key;
# to use an existing key, put it there (or run: qwen-stack github add OWNER/REPO --paste).
# NEVER paste a private key into this file: this file is part of a public git repository.
GITHUB_READONLY_REPOS=""

# Optional components.
INSTALL_SERVICE=yes        # system service that starts the server at boot
BUILD_SANDBOX_IMAGE=yes    # Docker image with OpenCode
