# qwen-coding-stack installer settings.
# Edit, then run ./install.sh. Empty values ("") use the profile defaults shown.
#
# These values seed config/server.env the FIRST time it's created. After that,
# change server settings with:  qwen-set KEY=VALUE   (re-running the installer
# never overwrites your tuned server.env).

# Project directory (everything is installed under it).
QCS=/home/tristanv/Development/qwen-coding-stack

# Machine profile: auto | popos-desktop | debian-laptop
#   auto: Pop!_OS -> popos-desktop (RTX 5080), Debian -> debian-laptop (RTX 4000 Ada)
PROFILE=auto

# CUDA toolkit version: auto (recommended) or a 13.x version like 13.1.
#   auto = the newest version your NVIDIA driver supports. A version is always
#   lowered to what the driver supports, and 13.2 (gibberish bug) is never used.
#   Plain "13" is treated as auto.
CUDA_VER=auto

# Reboot automatically when phase 1 needs it (driver / docker group).
#   no  = ask first      yes = reboot after a 15-second countdown
AUTO_REBOOT=no

# Pop!_OS only: reuse the model from the earlier manual setup (~/models),
# stop the old per-user service, and remove the old PATH/CUDA lines from ~/.bashrc.
MIGRATE_OLD=yes

# Find the GPU/RAM split automatically (find-ncmoe) on first install.
RUN_TUNING=yes
# Re-run tuning even if it already succeeded once.
RETUNE=no
# Values find-ncmoe tries, in order.   popos-desktop: "26 28 30 32 34 36 38 40"   debian-laptop: "34 36 38 40"
NCMOE_RANGE=""

# Starting values for server.env (first creation only).
#   popos-desktop: NCMOE=24 CTX=131072 THREADS=""     debian-laptop: NCMOE=34 CTX=65536 THREADS=8
NCMOE=""
CTX=""
THREADS=""

# Measure the fastest CPU thread count with llama-bench: auto | yes | no
#   auto = yes on debian-laptop (P-core/E-core CPU), no on popos-desktop
TUNE_THREADS=auto

# Sandbox container limits.   popos-desktop: 6g / 4    debian-laptop: 16g / 8
SANDBOX_MEMORY=""
SANDBOX_CPUS=""

# Optional components.
INSTALL_SERVICE=yes        # system service that starts the server at boot
BUILD_SANDBOX_IMAGE=yes    # Docker image with OpenCode
