# Qwen3.8 installer settings: Qwen3.8-27B on the Debian work laptop (RTX 4000 Ada 12 GB).
# Edit, then run ./install.sh. Empty values ("") use the defaults shown.
#
# These values seed config/server.env the FIRST time it's created. After that,
# change server settings with:  qwen38-set KEY=VALUE   (re-running the installer
# never overwrites your tuned server.env; changing QUANT switches the model and fits it again).

# Install directory: llama.cpp, the model, the commands and your OpenCode sessions.
# An install in the earlier place, ~/Development/qwen38-coding-stack, is moved here.
Q38=/home/tristanv/Development/qwen-runtime/qwen38

# This folder is for the Debian laptop; the installer refuses to run on another OS.
PROFILE=debian-laptop

# Model quant from unsloth/Qwen3.8-27B-GGUF. UD-IQ3_XXS (10.9 GB) fits entirely in 12 GB
# with a ~32K context. UD-Q3_K_XL (13.1 GB) is better quality but doesn't fit: the installer
# then moves some layers to RAM, at roughly a third of the speed.
QUANT=UD-IQ3_XXS

# CUDA toolkit version: auto (recommended) or a 13.x version like 13.1.
#   auto = the newest version your NVIDIA driver supports. A version is always
#   lowered to what the driver supports, and 13.2 (gibberish bug) is never used.
#   Plain "13" is treated as auto.
CUDA_VER=auto

# Reboot automatically when phase 1 needs it.   no = ask first   yes = 15-second countdown
AUTO_REBOOT=no

# Stop the Qwen3.6 stack's service from starting at boot (it stays installed;
# the two services can't run at the same time anyway).
DISABLE_QWEN36_AT_BOOT=yes

# Fit the model to your VRAM automatically on first install.
RUN_TUNING=yes
# Re-run fitting even if it already succeeded once.
RETUNE=no

# Starting values for server.env (first creation only). Defaults: NGL=99 (all layers on GPU) CTX=32768 THREADS=8
NGL=""
CTX=""
THREADS=""
# Thinking depth: none | low | medium | xhigh (Qwen's default; slow locally)
REASONING_EFFORT=medium

# Measure the fastest CPU thread count with llama-bench: auto (= no here: the model is all on the GPU) | yes | no
TUNE_THREADS=auto

# Sandbox container limits. Defaults: 16g / 8
SANDBOX_MEMORY=""
SANDBOX_CPUS=""

# More Debian (bookworm) packages to bake into the sandbox image, separated by spaces,
# e.g. "libsdl2-2.0-0 ffmpeg". The agent can't apt-get install inside the sandbox
# (it has no root), so add system libraries here and re-run install.sh: the image
# rebuilds when this changes.
SANDBOX_EXTRA_PACKAGES=""

# Read-only GitHub access for the sandbox: repositories as OWNER/REPO, separated by spaces,
# e.g. "haxxards/godot". For each one the installer makes a deploy key and shows the public
# key to add on GitHub (repository Settings > Deploy keys, "Allow write access" unticked).
# A key that can push, or a personal account key, is refused. Keys are kept outside this
# repository, in qwen-runtime/qwen38/config/github/OWNER/REPO/deploy_key;
# to use an existing key, put it there (or run: qwen38-stack github add OWNER/REPO --paste).
# NEVER paste a private key into this file: this file is part of a public git repository.
GITHUB_READONLY_REPOS=""

# Optional components.
INSTALL_SERVICE=yes
BUILD_SANDBOX_IMAGE=yes
