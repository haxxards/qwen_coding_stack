# qwen38-coding-stack installer settings (Qwen3.8-27B).
# Edit, then run ./install.sh. Empty values ("") use the profile defaults shown.
#
# These values seed config/server.env the FIRST time it's created. After that,
# change server settings with:  qwen38-set KEY=VALUE   (re-running the installer
# never overwrites your tuned server.env).

# Project directory (everything is installed under it).
Q38=/home/tristanv/Development/qwen38-coding-stack

# Machine profile: auto | popos-desktop | debian-laptop
#   auto: Pop!_OS -> popos-desktop (RTX 5080 16 GB), Debian -> debian-laptop (RTX 4000 Ada 12 GB)
PROFILE=auto

# Model quant from unsloth/Qwen3.8-27B-GGUF. UD-Q3_K_XL (13.1 GB) is recommended on
# both machines; UD-Q2_K_XL (9.8 GB) fits fully on the laptop GPU but loses more quality.
QUANT=UD-Q3_K_XL

# CUDA toolkit version: auto (recommended) or a 13.x version like 13.1.
#   auto = the newest version your NVIDIA driver supports. A version is always
#   lowered to what the driver supports, and 13.2 (gibberish bug) is never used.
#   Plain "13" is treated as auto.
CUDA_VER=auto

# Reboot automatically when phase 1 needs it.   no = ask first   yes = 15-second countdown
AUTO_REBOOT=no

# Stop the Qwen3.6 stack's service from starting at boot (it stays installed;
# the two services can't run at the same time anyway).
DISABLE_QWEN36_AT_BOOT=yes

# Fit the model to your VRAM automatically on first install.
RUN_TUNING=yes
# Re-run fitting/thread tuning even if it already succeeded once.
RETUNE=no

# Starting values for server.env (first creation only).
#   popos-desktop: NGL=99 (all layers on GPU) CTX=65536 THREADS=""
#   debian-laptop: NGL=44 CTX=65536 THREADS=8
NGL=""
CTX=""
THREADS=""
# Thinking depth: none | low | medium | xhigh (Qwen's default; slow locally)
REASONING_EFFORT=medium

# Measure the fastest CPU thread count with llama-bench: auto | yes | no
#   auto = yes on debian-laptop (layers in RAM, P/E-core CPU), no on popos-desktop
TUNE_THREADS=auto

# Sandbox container limits.   popos-desktop: 6g / 4    debian-laptop: 16g / 8
SANDBOX_MEMORY=""
SANDBOX_CPUS=""

# More Debian (bookworm) packages to bake into the sandbox image, separated by spaces,
# e.g. "libsdl2-2.0-0 ffmpeg". The agent can't apt-get install inside the sandbox
# (it has no root), so add system libraries here and re-run install.sh: the image
# rebuilds when this changes.
SANDBOX_EXTRA_PACKAGES=""

# Optional components.
INSTALL_SERVICE=yes
BUILD_SANDBOX_IMAGE=yes
